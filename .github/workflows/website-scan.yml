name: Website quick scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */2 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: website-quick-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Check sitemap URLs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5
      - name: Download current sitemap
        run: |
          mkdir -p site
          curl --fail --silent --show-error --location https://trbo.jiagar.us.kg/sitemap.xml --output sitemap.xml
          cp sitemap.xml site/sitemap.xml
          cp sitemap.xml site/sitemap
      - name: Run scanner
        id: scan
        continue-on-error: true
        env:
          SITEMAP_URL: https://trbo.jiagar.us.kg/sitemap.xml
        run: |
          python3 scan.py
      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v6
      - name: Upload sitemap Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy sitemap to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Publish sitemap release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="scan-$(date -u +%Y%m%dT%H%M%SZ)"
          gh release create "$TAG" sitemap.xml \
            --repo "$GITHUB_REPOSITORY" \
            --title "Website scan $TAG" \
            --notes "Automated sitemap snapshot from website quick scan workflow.\n\nScan run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Fail if website scan failed
        if: steps.scan.outcome != 'success'
        run: exit 1
